name: CI

on:
  push:
    branches: [ "main", "master", "feature/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install cppcheck
      run: sudo apt-get update && sudo apt-get install -y cppcheck
    - name: Run cppcheck
      run: cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unusedFunction --inline-suppr -I lab1/include lab1/src

  build-and-test:
    name: Build on ${{ matrix.os }}
    needs: static-analysis
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: lab1_cli_linux
            artifact_path: lab1/build/lab1_cli
          - os: windows-latest
            artifact_name: lab1_cli.exe
            artifact_path: lab1/build/Debug/lab1_cli.exe

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y cmake g++ lcov

    - name: Configure CMake
      run: cmake -S lab1 -B lab1/build -DCMAKE_BUILD_TYPE=Debug

    - name: Build
      run: cmake --build lab1/build --config Debug --parallel

    - name: Run tests
      run: ctest --test-dir lab1/build -C Debug --output-on-failure

    - name: Coverage (Linux only)
      if: matrix.os == 'ubuntu-latest'
      run: |
        cd lab1/build
        lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch,empty,gcov,source,inconsistent
        lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' '*/gtest*' '*/main.cpp' --output-file coverage.info --ignore-errors unused,source
        lcov --list coverage.info --fail-under-lines 90

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: ${{ matrix.artifact_path }}

  release:
    name: Create Release
    needs: build-and-test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Prepare files
      run: |
        mkdir -p release_files
        find artifacts -type f -exec cp {} release_files/ \;

    - name: Release
      uses: softprops/action-gh-release@v2
      with:
        files: release_files/*
