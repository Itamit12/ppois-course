name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ lcov cppcheck

      - name: Configure
        run: cmake -S lab1 -B lab1/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build lab1/build --parallel

      - name: Run tests
        run: ctest --test-dir lab1/build --output-on-failure

      - name: Coverage
        run: |
          cd lab1/build
          lcov --capture --directory . --output-file coverage.info --ignore-errors mismatch,empty,gcov,source
          lcov --remove coverage.info '/usr/*' '*/tests/*' '*/_deps/*' '*/gtest*' '*/main.cpp' --output-file coverage.info --ignore-errors unused,source
          lcov --list coverage.info --ignore-errors empty

      - name: Static analysis (cppcheck)
        run: cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unusedFunction --inline-suppr -I lab1/include lab1/src

  release:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake g++

      - name: Build release
        run: |
          cmake -S lab1 -B lab1/build -DCMAKE_BUILD_TYPE=Release
          cmake --build lab1/build --parallel

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: lab1-v${{ github.run_number }}
          name: Lab1 Release v${{ github.run_number }}
          files: lab1/build/lab1_cli
          generate_release_notes: true