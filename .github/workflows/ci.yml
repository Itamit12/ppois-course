name: CI

on:
  push:
    branches: [ main, 'feature/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ lcov cppcheck

      - name: Configure
        run: cmake -S lab1 -B lab1/build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build
        run: cmake --build lab1/build --parallel

      - name: Run tests
        run: ctest --test-dir lab1/build --output-on-failure

      - name: Coverage
        run: |
          cd lab1/build
          lcov --capture --directory . --output-file coverage.info \
               --ignore-errors mismatch,empty,gcov,source
          lcov --remove coverage.info \
               '/usr/*' \
               '*/tests/*' \
               '*/_deps/*' \
               '*/gtest*' \
               '*/googletest*' \
               '*/main.cpp' \
               --output-file coverage.info \
               --ignore-errors unused,source
          echo "=== Coverage summary ==="
          lcov --list coverage.info --ignore-errors empty
          echo "=== Generating HTML ==="
          genhtml coverage.info --output-directory coverage_html \
                  --ignore-errors source,unused,empty
          echo "=== HTML generated ==="

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: lab1/build/coverage_html/

      - name: Static analysis (cppcheck)
        run: cppcheck --enable=all --error-exitcode=1 --suppress=missingIncludeSystem --suppress=unusedFunction --inline-suppr -I lab1/include lab1/src

  release:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: sudo apt-get install -y cmake g++

      - name: Build release
        run: |
          cmake -S lab1 -B lab1/build -DCMAKE_BUILD_TYPE=Release
          cmake --build lab1/build --parallel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab1-cli
          path: lab1/build/lab1_cli